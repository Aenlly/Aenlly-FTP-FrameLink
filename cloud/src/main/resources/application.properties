server.address=${FRAME_BIND_ADDRESS:127.0.0.1}
server.port=${FRAME_PORT:8087}
spring.datasource.url=${FRAME_DATABASE_URL:jdbc:h2:file:./data/framelink;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${FRAME_DATABASE_USER:sa}
spring.datasource.password=${FRAME_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1025MB
spring.servlet.multipart.file-size-threshold=0
server.error.include-message=never
server.error.include-stacktrace=never
app.invite-code=${FRAME_INVITE_CODE:}
app.public-url=${FRAME_PUBLIC_URL:http://localhost:5177}
app.storage-mode=${FRAME_STORAGE_MODE:local}
app.storage-dir=${FRAME_STORAGE_DIR:./data/objects}
app.s3.endpoint=${FRAME_S3_ENDPOINT:}
app.s3.region=${FRAME_S3_REGION:us-east-1}
app.s3.bucket=${FRAME_S3_BUCKET:framelink}
app.s3.access-key=${FRAME_S3_ACCESS_KEY:}
app.s3.secret-key=${FRAME_S3_SECRET_KEY:}
